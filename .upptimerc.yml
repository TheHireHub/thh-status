# TheHireHub status monitor — https://status.thehirehub.ai
# Monitoring engine: Upptime (GitHub Actions). The public page is our own
# static site in ./site, deployed by .github/workflows/pages.yml and fed by
# history/summary.json + GitHub issues labelled "status".
owner: TheHireHub
repo: thh-status
user-agent: TheHireHub

sites:
  - name: Website
    url: https://www.thehirehub.ai
    expectedStatusCodes: [200]
  - name: Platform
    url: https://www.thehirehub.ai/dashboard
    expectedStatusCodes: [200]
  - name: API
    url: https://api.thehirehub.ai/health
    expectedStatusCodes: [200]
  - name: Media
    url: https://media.thehirehub.ai/thh-demo-2min-web.mp4
    method: HEAD
    expectedStatusCodes: [200]

# Upptime's own Svelte site is not used; Pages is served from ./site via
# pages.yml. Kept minimal so the generator has what it needs.
status-website:
  cname: status.thehirehub.ai
  logoUrl: https://www.thehirehub.ai/icons/logo.svg
  name: TheHireHub Status
  introTitle: "**TheHireHub** system status"
  introMessage: Live status of thehirehub.ai — website, platform, API and media.
  navbar:
    - title: Status
      href: /
    - title: TheHireHub
      href: https://www.thehirehub.ai

# Don't spam the repo with commits when nothing changed.
commitMessages:
  commitAuthorName: TheHireHub Status Bot
  commitAuthorEmail: status@thehirehub.ai

# Workflows are pinned to Upptime v1.44.0 and committed by hand (no
# GH_PAT, so the template updater is not run). Edit .github/workflows/*.yml
# directly to change schedules.

# Keep issues (they are our public incident log).
skipDeleteIssues: true
