# Deploys ./site (our own status page) to GitHub Pages.
# Not generated by Upptime — safe from template updates.
name: Status Page
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    # AUDIT-DECISION(AUD-INFRA-45db7e76): master only, so a Dependabot branch push cannot start a Pages
    # deploy or cancel a live one via the shared "pages" concurrency group.
    branches: [master]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  issues:
    types: [opened, edited, closed, reopened, labeled]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # AUDIT-DECISION(AUD-STAT-a9f1b6bd): checkout@v6 like the other workflows (node20 runtime retiring);
      # upload-pages-artifact/deploy-pages majors are left to the Dependabot github-actions group.
      - uses: actions/checkout@v6
      # build-data.sh reads only the last 24 h of history/<slug>.yml commits, so deepen the default
      # depth-1 checkout to 2 days instead of cloning the whole bot-commit history (fetch-depth: 0).
      - name: Fetch last 2 days of history
        # AUDIT-DECISION(AUD-STAT-5ae9d7fd): 2-day margin keeps the shallow boundary outside the 24 h window;
        # if no commit is that recent git refuses, and depth 1 already holds every commit the window needs.
        run: git fetch --no-tags --shallow-since="2 days ago" origin "$GITHUB_REF_NAME" || echo "::warning::shallow-since fetch failed; building from depth-1 checkout"
      - name: Build data.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/build-data.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
