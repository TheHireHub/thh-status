# Deploys ./site (our own status page) to GitHub Pages.
# Not generated by Upptime — safe from template updates.
name: Status Page
on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  issues:
    types: [opened, edited, closed, reopened, labeled]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
  issues: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build data.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/build-data.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
